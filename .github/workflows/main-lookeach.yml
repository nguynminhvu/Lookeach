name: Deploy ASP.NET Core app to Azure Web App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  AZURE_WEBAPP_NAME: lookeack-api-svc    # set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: "./publish"     # set this to the path to your web app project, defaults to the repository root

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:

      # Checkout the repo
      - uses: actions/checkout@v3
      
      # Setup .NET Core SDK
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x 
      
      # Run dotnet build and publish
      - name: dotnet build and publish
        run: |
          dotnet restore ./.net/Lookeach/Lookeach/Lookeach.csproj
          dotnet build ./.net/Lookeach/Lookeach/Lookeach.csproj --configuration Release
          dotnet publish ./.net/Lookeach/Lookeach/Lookeach.csproj ./publish
          
      # Deploy to Azure Web apps
      - name: 'Run Azure webapp deploy action using publish profile credentials'
        uses: azure/webapps-deploy@v2
        with: 
          app-name: lookeack-api-svc # Replace with your app name
          publish-profile: ${{ secrets.LOOKEACH_ACTION_SECRET  }} # Define secret variable in repository settings as per action documentation
          package: ./publish

# For more samples to get started with GitHub Action workflows to deploy to Azure, refer to https://github.com/Azure/actions-workflow-samples
